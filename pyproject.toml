[project]
name = "jarvis"
version = "0.1.0"
description = "Asistente personal de voz para Windows"
requires-python = ">=3.12"
dependencies = [
    "openwakeword>=0.6",
    "sounddevice>=0.4",
    "soundcard>=0.4",  # loopback WASAPI real (jarvis.audio.loopback) — sounddevice/PortAudio no
    # soporta loopback (feature request abierta: spatialaudio/python-sounddevice#281)
    "numpy>=1.26",
    "openai>=1.0",
    "httpx>=0.27",
    "playsound3>=3.0",
    "pyttsx3>=2.90",  # jarvis.audio.tts: SAPI local, default de TTS desde ADR-0013 (gratis, sin
    # red ni cuenta — nunca depende de crédito externo que se pueda agotar, a diferencia de la
    # voz neural de OpenAI, que queda como alternativa swappable pero ya no es el default).
    "psutil>=6.0",  # system_info: CPU/RAM sin WMI verboso/inestable (jarvis.tools.system_info)
    "Pillow>=10.0",  # screenshot: PIL.ImageGrab sin GDI a mano via ctypes (jarvis.tools.screenshot)
    "pycaw>=20220416",  # volume_control: nivel exacto de volumen via IAudioEndpointVolume, la
    # Core Audio API de Windows no tiene equivalente en stdlib ni via keybd_event (solo pasos
    # gruesos) — pycaw es la envoltura estándar y ampliamente usada de esa API COM en el
    # ecosistema Python-Windows (jarvis.tools.volume_control). `comtypes`, de la que depende, es
    # una dependencia transitiva declarada por el propio `pycaw` (junto con `psutil`, que ya era
    # dependencia directa de este repo via jarvis.tools.system_info) — no se declara aparte.
    "websockets>=13,<16",  # jarvis.audio.realtime_stt (streaming STT, ADR-0012): import directo
    # de `websockets.connect`/`websockets.asyncio.client.ClientConnection` para hablar el
    # protocolo WebSocket documentado de la Realtime API de Speechmatics, en vez de sumar el SDK
    # oficial `speechmatics-rt` como dependencia nueva — evaluado y descartado con criterio, ver
    # docstring de `realtime_stt.py` (su modelo de eventos no expone públicamente la tarea interna
    # de recepción que este módulo necesita para el backstop de "conexión caída sin avisar").
    # Dependencia heredada de cuando este mismo módulo hablaba la Realtime API de OpenAI (ADR-0007,
    # vía `client.realtime.connect()` del SDK de OpenAI, que la importaba de forma perezosa) —
    # ya no hay ningún uso de `client.realtime.*` de OpenAI en el repo (el batch STT que sigue en
    # OpenAI, `jarvis.audio.stt`, usa `client.audio.transcriptions.create()`, sin WebSocket), pero
    # sigue siendo dependencia dura porque ahora este módulo la usa directo. Rango sin cambios
    # (`<16,>=13`): sigue siendo la versión instalada (15.0.1) y compatible con el uso de acá.
    "silero-vad-lite>=0.2.1",  # detector de voz real (jarvis.audio.speech_detector) — reemplaza
    # el RMS/volumen como criterio de "¿esto es voz?" (confundía ruido fuerte de juego/clics con
    # habla real, 30% de falsos positivos medidos en vivo). Deliberadamente NO el paquete oficial
    # `silero-vad`: ese declara `torch>=1.12.0`/`torchaudio>=0.12.0` como dependencias duras
    # (verificado contra el JSON real de PyPI) — mismo tipo de bloat que ya se descartó para
    # `noisereduce` (arrastraba `matplotlib`). `silero-vad-lite` tiene cero dependencias pip en
    # runtime (bundlea ONNX Runtime como extensión compilada, wheels Windows `cp312-win_amd64`
    # confirmados) — paquete de un solo mantenedor, no el oficial del equipo Silero, trade-off
    # aceptado a cambio de evitar la dependencia pesada.
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "types-psutil>=6.0",  # stubs para psutil bajo mypy --strict (jarvis.tools.system_info)
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# `SYSTEM_PROMPT`/`_*_FRAMING_HEADER` (jarvis.audio.pipeline) se cargan en runtime vía
# `Path.read_text()` desde `jarvis/audio/prompts/*.md` — sin esto, un build de wheel/sdist real
# (a diferencia de `pip install -e .`, que lee directo del árbol fuente) empaquetaría solo los
# `.py` y dejaría esos archivos afuera, rompiendo la carga en tiempo de importación.
jarvis = ["audio/prompts/*.md"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = [
    "sounddevice",
    "soundcard",
    "openwakeword.*",
    "playsound3.*",
    "pyttsx3",
    "comtypes",
    "comtypes.*",
    "pycaw.*",
    "silero_vad_lite",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
