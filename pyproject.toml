[project]
name = "jarvis"
version = "0.1.0"
description = "Asistente personal de voz para Windows"
requires-python = ">=3.12"
dependencies = [
    "openwakeword>=0.6",
    "sounddevice>=0.4",
    "soundcard>=0.4",  # loopback WASAPI real (jarvis.audio.loopback) — sounddevice/PortAudio no
    # soporta loopback (feature request abierta: spatialaudio/python-sounddevice#281)
    "numpy>=1.26",
    "openai>=1.0",
    "httpx>=0.27",
    "pyttsx3>=2.90",
    "playsound3>=3.0",
    "psutil>=6.0",  # system_info: CPU/RAM sin WMI verboso/inestable (jarvis.tools.system_info)
    "Pillow>=10.0",  # screenshot: PIL.ImageGrab sin GDI a mano via ctypes (jarvis.tools.screenshot)
    "pycaw>=20220416",  # volume_control: nivel exacto de volumen via IAudioEndpointVolume, la
    # Core Audio API de Windows no tiene equivalente en stdlib ni via keybd_event (solo pasos
    # gruesos) — pycaw es la envoltura estándar y ampliamente usada de esa API COM en el
    # ecosistema Python-Windows (jarvis.tools.volume_control). `comtypes`, de la que depende, ya
    # era una dependencia transitiva existente (via pyttsx3).
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "types-psutil>=6.0",  # stubs para psutil bajo mypy --strict (jarvis.tools.system_info)
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = [
    "sounddevice",
    "soundcard",
    "openwakeword.*",
    "pyttsx3.*",
    "playsound3.*",
    "comtypes",
    "comtypes.*",
    "pycaw.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
